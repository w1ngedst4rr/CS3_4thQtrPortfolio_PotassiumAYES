  <style>
    body { font-family: Arial, sans-serif; }

    .header, .footer {

    .footer {
      opacity: 0.5;
      position: fixed;
      bottom: 0;

    .sidebar {
      background: lightgreen;
      width: 150px;
      height: 200px;
      position: relative;
      top: 20px;
      left: 20px;
    }

    .content {
      background: lightyellow;
      width: 300px;
      height: 200px;
      position: absolute;
      top: 66px;
      left: 200px;
      z-index: 1;
    }

    .notice {
      position: absolute;
      top: 60px;
      left: 400px;
      background: orange;
      padding: 10px;
      z-index: 2;
    }

    .content-relative {
      position: relative;
    }

    .content-relative .notice {
      top: 0;
      right: 0;
      left: auto;
    }

  </style>
</head>

<body>

  <div class="header">Header</div>

  <div class="sidebar">Sidebar</div>

  <div class="content content-relative">
    Main Content
    <div class="notice">Notice!</div>
  </div>

  <div class="footer">Footer</div>

</body>

a.) Could you summarize the differences between the CSS position values (static, relative, absolute, fixed)?

    1.) Static – Default, follows normal flow, cannot be moved
    2.) Relative – Moves relative to its original position
    3.) Absolute – Positioned relative to nearest positioned parent, removed from flow
    4.) Fixed – Positioned relative to the screen, stays in place when scrolling


b.) How does absolute positioning depend on its parent element?

    Absolute positioning depends on the nearest parent with a position value other than static. If no such parent exists, it uses the entire page (body) as reference.


c.) How do you differentiate sticky from fixed (you can research on sticky)?

    1.) Fixed: Always stays in the same position on the screen
    2.) Sticky: Acts like relative at first, then becomes fixed when you scroll to a certain point
